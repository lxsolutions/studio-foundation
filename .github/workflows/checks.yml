name: checks

# The fast, hosted half of the repository's own gate. `validate.yml` (the
# self-hosted studio workflow described in tools/ci/validate_workflows.py) runs
# the heavy suites -- Godot, Rust, the engine build -- on trusted hardware. This
# runs the part that needs no toolchain at all, so a fork or a first-time reader
# can see the same result without a runner.
#
# Everything here is stdlib-only Python. No Godot, no Emscripten, no GPU, no
# database, no network beyond the checkout and the uv install.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: workflow and secret policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # The validator parses YAML, and pyyaml is a `tools` dev dependency rather
      # than stdlib -- so this runs through uv exactly as `just lint-workflows`
      # does, not with a bare interpreter.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # Enforces the studio's CI security contract on this very directory:
      # every action pinned to a full commit, no self-hosted job reachable from
      # an untrusted pull request. It is deliberately run first -- a workflow
      # that violates the policy should fail before it does any work.
      - name: Validate workflow trust and action pins
        run: uv run --project tools python tools/ci/validate_workflows.py

      - name: Scan for committed secrets
        run: uv run --project tools python tools/ci/secret_scan.py

      # The repository's prose must agree with its pinned artifacts: op counts,
      # patch counts, test counts, and no indefensible claims. Stdlib only.
      - name: Check public claims against the artifacts
        run: uv run --project tools python tools/ci/check_claims.py

  python:
    name: python unit suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # The engine-script suite is plain stdlib and covers the patch-series
      # checker's own failure paths -- the gate that guards the gate.
      - name: Engine scripts
        run: python -m unittest discover -s engine/scripts/tests -p "test_*.py"

      - name: studio-mcp
        run: uv run --project tools python -m unittest discover -s tools/studio-mcp/tests -p "test_*.py"

      - name: infra
        run: uv run --project tools python -m unittest discover -s tools/infra/tests -p "test_*.py"

      - name: asset pipeline
        run: uv run --project tools python -m unittest discover -s tools/asset-pipeline/tests -p "test_*.py"

      # Only bforge's schema suite runs here. test_mcp.py looks like a pure
      # tool-surface test but constructs a Forge, which resolves a Blender
      # binary in its constructor and raises DaemonError without one -- so it
      # belongs to the self-hosted suite, not a bare hosted runner.
      - name: bforge schema
        run: uv run --project tools python -m unittest discover -s tools/bforge/tests -p "test_schema.py"

      - name: worldc (World IR validation + artifact verification)
        run: uv run --project tools python -m unittest discover -s tools/worldc/tests -p "test_*.py"

      - name: sim kernel (deterministic replay, golden hashes)
        run: uv run --project tools python -m unittest discover -s tools/sim/tests -p "test_*.py"

      - name: brief-to-asset static checks
        run: uv run --project tools python -m unittest discover -s benchmarks/brief-to-asset/tests -p "test_*.py"

      - name: brief-to-battle static checks
        run: uv run --project tools python -m unittest discover -s benchmarks/brief-to-battle/tests -p "test_*.py"

      - name: Protocol golden fixtures
        run: uv run --project tools python tools/asset-pipeline/check_fixtures.py

  parity:
    name: sim kernel parity (native + wasm, mandatory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # The claim this job substantiates: Python == native Rust == Wasm on the
      # shared conformance corpus. It must FAIL, not skip, when the toolchain
      # cannot be established — hence the explicit target install and
      # SIM_REQUIRE_PARITY.
      - name: wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: native kernel + conformance corpus
        run: cargo test -p sim-kernel --manifest-path services/Cargo.toml

      - name: three-way parity (fail-closed)
        env:
          SIM_REQUIRE_PARITY: "1"
        run: uv run --project tools python -m unittest discover -s tools/sim/tests -p "test_parity.py"

      # The renderer observes: viewer frames must equal kernel snapshots
      - name: runtime adapter (frames == snapshots)
        run: node tools/sim-viewer/adapter_test.mjs services/target/wasm32-unknown-unknown/release/sim_kernel.wasm tools/worldc/examples/fortress_battle.json tools/worldc/examples/fortress_gate.json

  bench:
    name: bforge bench (public number, regenerated and diffed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # The bench drives a real Blender: official tarball, headless, CPU-only.
      # The archive is hash-pinned in tools/bforge/blender-lock.toml — the same
      # treatment the engine lock gives Godot patches and templates.
      - name: install Blender 4.5 LTS (hash-verified)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libxkbcommon0 libsm6 libice6 libxxf86vm1 libxfixes3 libegl1 libgl1
          URL=$(python3 -c 'import tomllib; print(tomllib.load(open("tools/bforge/blender-lock.toml","rb"))["blender"]["url"])')
          curl -sL -o /tmp/blender.tar.xz "$URL"
          python3 - <<'EOF'
          import hashlib, tomllib
          with open("tools/bforge/blender-lock.toml", "rb") as fh:
              lock = tomllib.load(fh)["blender"]
          digest = hashlib.sha256()
          with open("/tmp/blender.tar.xz", "rb") as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b""):
                  digest.update(chunk)
          assert digest.hexdigest() == lock["sha256"], \
              f"Blender archive sha256 mismatch: {digest.hexdigest()} != {lock['sha256']}"
          print(f"verified {lock['archive']} sha256={lock['sha256'][:16]}…")
          EOF
          sudo mkdir -p /opt/blender
          sudo tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          /opt/blender/blender --version | head -1

      - name: run the bench
        env:
          BLENDER_BIN: /opt/blender/blender
        run: uv run --project tools python tools/bforge/bench.py

      # The whole live-Blender surface, not just the schema subset — the README
      # quotes a test count, and a count the public gate does not run is not a
      # claim, it is a hope. One daemon is shared per module, so discovery is
      # cheap despite booting real Blender.
      - name: bforge full live suite
        env:
          BLENDER_BIN: /opt/blender/blender
        run: uv run --project tools python -m unittest discover -s tools/bforge/tests -p "test_*.py"

      # The committed summary is the public number: if the tooling changed the
      # deterministic output, this diff fails and the summary must be
      # re-committed honestly. report.json also carries wall-clock seconds,
      # which are machine-dependent, so it stays out of the diff.
      - name: the committed number matches a fresh run
        run: git diff --exit-code tools/bforge/bench/SUMMARY.md

      # The frozen public benchmark (ADR 0018 M4): the reference agent must
      # stay 6/6 and the committed scorecard must match a fresh run.
      - name: brief-to-asset benchmark (reference agent)
        env:
          BLENDER_BIN: /opt/blender/blender
        run: uv run --project tools python benchmarks/brief-to-asset/bench.py --summary --agent "python3 benchmarks/brief-to-asset/agents/scripted_recipe.py"

      - name: the committed scorecard matches a fresh run
        run: git diff --exit-code benchmarks/brief-to-asset/SUMMARY.md

      # The world-level half: the reference agent's world must compile with
      # proof, play out as briefed, and hash identically twice.
      - name: brief-to-battle benchmark (reference agent)
        env:
          BLENDER_BIN: /opt/blender/blender
        run: uv run --project tools python benchmarks/brief-to-battle/bench.py --summary --agent "python3 benchmarks/brief-to-battle/agents/scripted_world.py"

      - name: the committed battle scorecard matches a fresh run
        run: git diff --exit-code benchmarks/brief-to-battle/SUMMARY.md
