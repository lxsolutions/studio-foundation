<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sim-viewer — the fortress battle, observed</title>
<style>
  body { margin: 0; background: #0b0e14; color: #e6ebf5; font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 12px 18px; background: rgba(11,14,20,.85); z-index: 2; }
  #hud b { color: #f5903a; }
  #status { color: #a8b2c7; font-size: .9rem; }
  #nav { margin-top: 6px; font-size: .85rem; }
  .blocked { color: #f5c74b; } .open { color: #4ec98a; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@8.38.0/babylon.js"
        integrity="sha384-TcWJh5cKstFnYiX5D8qWWofnEFn8/gZGBDJzDrlhvKEyZrS9OsYQy/HyAuWglDth"
        crossorigin="anonymous"></script>
</head>
<body>
<div id="hud">
  <b>sim-viewer</b> — the fortress battle, driven by the deterministic kernel.
  The renderer only observes snapshots; it cannot touch simulation state.
  <div id="status">loading…</div>
  <div id="nav"></div>
</div>
<canvas id="view"></canvas>
<script type="module">
import { framesFromSnapshots, jointsFromEntityDocs, runReplayWasm } from "./adapter.js";

const status = (t) => document.getElementById("status").textContent = t;
const TICK_MS = 450;

async function main() {
  // config: which world compile to observe (generated by `just sim-viewer`)
  const config = await (await fetch("./config.json")).json();
  const [wasm, replayText, gateDoc] = await Promise.all([
    fetch(config.wasm).then(r => r.arrayBuffer()),
    fetch(config.replay).then(r => r.text()),
    fetch(config.entityDoc).then(r => r.json()),
  ]);
  status("running the kernel…");

  const result = await runReplayWasm(wasm, replayText);
  if (result.error) { status(`kernel error: ${result.code}`); return; }
  const frames = framesFromSnapshots(result.snapshots, jointsFromEntityDocs({ gate: gateDoc }));
  status(`kernel finished: ${frames.length} ticks, final hash ${result.state_hash.slice(0, 12)}…`);

  const canvas = document.getElementById("view");
  const engine = new BABYLON.Engine(canvas, true);
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.04, 0.05, 0.08, 1);

  const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2.3, 1.05, 9, new BABYLON.Vector3(0, 1.2, 0), scene);
  camera.attachControl(canvas, true);
  new BABYLON.HemisphericLight("sky", new BABYLON.Vector3(0.3, 1, 0.2), scene);
  const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.4, -0.8, 0.3), scene);

  // the gate asset, forged by bforge and proven by worldc — loaded as geometry only
  const loaded = await BABYLON.SceneLoader.ImportMeshAsync("", config.glbDir, config.glb, scene);
  const byName = {};
  for (const mesh of loaded.meshes) byName[mesh.name] = mesh;
  const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 30, height: 30 }, scene);
  const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
  groundMat.diffuseColor = new BABYLON.Color3(0.16, 0.17, 0.2);
  ground.material = groundMat;

  // two gate instances: main at x=-2.2, side at x=+2.2
  const instances = {};
  for (const [entityName, x] of [["gate_main", -2.2], ["gate_side", 2.2]]) {
    const map = {};
    for (const part of ["frame", "leaf_l", "leaf_r"]) {
      const src = byName[part];
      map[part] = src ? src.clone(`${entityName}_${part}`) : null;
      if (map[part]) map[part].position.x += x;
    }
    instances[entityName] = map;
  }

  const nav = document.getElementById("nav");
  let shown = 0;
  const timer = setInterval(() => {
    if (shown >= frames.length) { clearInterval(timer); return; }
    const frame = frames[shown++];
    for (const [name, entity] of Object.entries(frame.entities)) {
      const map = instances[name];
      if (!map) continue;
      const rad = (entity.angleDeg * Math.PI) / 180;
      if (map.leaf_l) map.leaf_l.rotation.y = -rad;
      if (map.leaf_r) map.leaf_r.rotation.y = rad;
    }
    nav.innerHTML = Object.entries(frame.entities)
      .map(([n, e]) =>
        `<span class="${e.blocked ? "blocked" : "open"}">${n}: ` +
        `${e.destroyed ? "destroyed" : e.blocked ? "BLOCKED" : "passable"}` +
        ` · openness ${(e.openness / 1000).toFixed(2)} · hp ${e.health}</span>`)
      .join("<br>");
    status(`tick ${frame.tick} / ${frames.length - 1} — hash ${result.hash_log[frame.tick].slice(0, 12)}…`);
  }, TICK_MS);

  engine.runRenderLoop(() => scene.render());
  addEventListener("resize", () => engine.resize());
}
main().catch((e) => status(`failed: ${e.message} — run \`just sim-viewer\` first`));
</script>
</body>
</html>
